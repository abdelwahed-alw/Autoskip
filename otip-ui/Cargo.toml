[package]
name = "otip-ui"
version = "0.1.0"
edition = "2021"
description = "Iced-based UI for Otip video player"

[dependencies]
otip-core = { path = "../otip-core" }
otip-video = { path = "../otip-video", features = ["gstreamer"] }
otip-ai = { path = "../otip-ai" }
iced = { workspace = true }
tokio = { workspace = true, features = ["full", "sync", "time", "macros", "fs", "process"] }
async-channel = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std", "log"] }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde", "fast-rng"] }
chrono = { workspace = true, features = ["serde", "clock"] }
bytes = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
walkdir = { workspace = true }
notify = { workspace = true }
mime_guess = { workspace = true }
directories = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
lyon = { workspace = true }
euclid = { workspace = true }
rpds = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }