[workspace]
resolver = "2"
members = [
    "otip-core",
    "otip-video",
    "otip-ai",
    "otip-ui",
    "otip-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abdelwahed/otip"
description = "AI-powered cross-platform video player with lookahead content moderation"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"] }
bytes = "1.5"
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "5.5"
once_cell = "1.19"
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal"] }
async-trait = "0.1"
futures = "0.3"
async-channel = "2.0"
flume = "0.11"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream", "cookies", "gzip", "brotli", "deflate"] }

# Image
image = { version = "0.25", features = ["png", "jpeg", "rayon"] }
imageproc = "0.25"
base64 = "0.22"

# GUI
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
# iced_aw = { version = "0.12", features = ["tab_bar", "selection_list"] }

# Video
mpv = { version = "0.2" }
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-video = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }
gstreamer-gl = { version = "0.25", features = ["v1_20"] }
gstreamer-base = { version = "0.25", features = ["v1_20"] }

# Hardware

# Config
config = "0.14"
toml = "0.8"
directories = "5.0"
clap = { version = "4.5", features = ["derive", "env", "help", "usage", "wrap_help", "string"] }

# Files
walkdir = "2.5"
notify = { version = "6.1", features = ["mio"] }
mime_guess = "2.0"
rfd = "0.15"
dirs = "5.0"

# Math
euclid = "0.22"
lyon = "1.0"
rpds = "1.2"

# Logging
tracing = { version = "0.1", features = ["std", "log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json", "chrono"] }

# Dev
proptest = "1.4"
mockall = "0.13"
rstest = "0.18"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
debug = true

[profile.test]
debug = true