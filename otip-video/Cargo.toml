[package]
name = "otip-video"
version = "0.1.0"
edition = "2021"
description = "Video engine abstraction with GStreamer backend"

[dependencies]
otip-core = { path = "../otip-core" }
tokio = { workspace = true, features = ["full", "sync", "time", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
crossbeam-channel = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
image = { workspace = true, features = ["png", "jpeg"] }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }

# libmpv backend (render_context + wgpu zero-copy)
libmpv2 = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[features]
default = ["mpv"]
mpv = ["dep:libmpv2", "dep:wgpu", "dep:ash", "dep:raw-window-handle"]
gstreamer = []
cuda = []
vulcan = []

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }